name: Harness checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install -y age
      - run: pnpm install --frozen-lockfile
      - name: Scan branch changes for sensitive content
        run: pnpm check:sensitive -- --base "$BASE_REF"
      - run: pnpm capabilities check
      - name: Check documentation and new topic placement
        run: pnpm check:docs -- --base "$BASE_REF"
      - name: Check tracked Markdown
        run: git ls-files -z '*.md' | xargs -0 pnpm check:markdown --
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
