name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  node:
    name: Node tests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install age test prerequisite
        run: sudo apt-get update && sudo apt-get install --yes age

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check documentation structure
        run: pnpm check:docs

      - name: Check Markdown
        run: pnpm check:markdown -- $(git ls-files '*.md')

  terraform:
    name: Terraform format, validate, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Check formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Initialize providers
        run: terraform -chdir=infrastructure init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir=infrastructure validate

      - name: Run mock-provider tests
        run: terraform -chdir=infrastructure test
