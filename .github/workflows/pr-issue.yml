name: PR issue link
# Separate from Harness quality so body edits rerun only this check.
# pull_request_target runs the base branch's copy, so a PR cannot rewrite the check that gates it.
# Never check out or run the PR head here.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
  issues: read
jobs:
  pr-issue:
    name: PR issue link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check branch name and linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node --import tsx scripts/check-pr-issue.ts
